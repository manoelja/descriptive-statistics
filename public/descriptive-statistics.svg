<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="rhue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- chip (R console perspective) -->
  <rect x="4" y="4" width="56" height="56" rx="13"
        fill="url(#chip)" stroke="#1b2438" stroke-width="1.25"/>

  <!-- R-panel frame (3x3 data grid) -->
  <g stroke="#1b2438" stroke-width="1" fill="none">
    <rect x="10.5" y="10.5" width="43" height="43" rx="6" opacity="0.95"/>
    <line x1="21.5" y1="10.5" x2="21.5" y2="53.5" opacity="0.55"/>
    <line x1="32.5" y1="10.5" x2="32.5" y2="53.5" opacity="0.55"/>
    <line x1="43.5" y1="10.5" x2="43.5" y2="53.5" opacity="0.55"/>
    <line x1="10.5" y1="21.5" x2="53.5" y2="21.5" opacity="0.55"/>
    <line x1="10.5" y1="32.5" x2="53.5" y2="32.5" opacity="0.55"/>
    <line x1="10.5" y1="43.5" x2="53.5" y2="43.5" opacity="0.55"/>
  </g>

  <!-- ticks (R panel x-axis ticks + SARS-CoV-2 inspired micro spikes) -->
  <g stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)">
    <!-- axis tick cluster -->
    <line x1="15" y1="10.5" x2="15" y2="7.6"/>
    <line x1="20" y1="10.5" x2="20" y2="6.4"/>
    <line x1="25" y1="10.5" x2="25" y2="7.6"/>
    <line x1="30" y1="10.5" x2="30" y2="6.4"/>
    <line x1="35" y1="10.5" x2="35" y2="7.6"/>
    <line x1="40" y1="10.5" x2="40" y2="6.4"/>
    <line x1="45" y1="10.5" x2="45" y2="7.6"/>
    <line x1="50" y1="10.5" x2="50" y2="6.4"/>

    <!-- monogram G spine hint (slight glyph) -->
    <path d="M15 10.5 l-1.1 0 l0 -2.6 l2.2 0 z"/>
    <path d="M50 10.5 l1.1 0 l0 -2.6 l-2.2 0 z"/>
  </g>

  <!-- R console prompt dot -->
  <circle cx="13" cy="13.5" r="1.15" fill="#4ade80" filter="url(#glow)"/>

  <!-- main diagnostic: Goiânia weekly curve (R-style line, ggplot2 inspired) -->
  <g filter="url(#glow)">
    <path d="M13 47.4
             L18 45.6
             L23 44.4
             L28 42.6
             L33 40.6
             L38 37.6
             L43 33.8
             L47 31.0"
          stroke="url(#rhue)" stroke-width="2.6"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="47" cy="31.0" r="2.8" fill="#4ade80"/>

    <!-- sampling tick at last point -->
    <g stroke="#4ade80" stroke-width="1" opacity="0.7">
      <line x1="47" y1="45.5" x2="47" y2="31.0"/>
      <line x1="11.5" y1="45.5" x2="47" y2="45.5"/>
    </g>
  </g>

  <!-- small SARS-CoV-2 hint (Goiânia target): teal dot + soft ring -->
  <g filter="url(#glow)">
    <circle cx="47" cy="31.0" r="6.2" fill="none"
            stroke="#2dd4bf" stroke-width="1" opacity="0.55"/>
    <circle cx="47" cy="31.0" r="2.8" fill="#2dd4bf" opacity="0.92"/>
  </g>

  <!-- Goiânia ident key (subtle G fragment in the grid) -->
  <g stroke="#2dd4bf" stroke-width="1.1" stroke-linecap="round" opacity="0.85">
    <path d="M34 21.5 h6.5 m0 4 h-6.5 m0 4 h5.6"/>
    <path d="M40.5 17.5 l1.6 1.7 -0.5 2.6 -1.6 -0.9" fill="none"/>
  </g>

  <!-- panel bracket (terminal feel) -->
  <path d="M10.5 49.5 h43" stroke="#2dd4bf" stroke-width="1"
        stroke-dasharray="3.2 2.4" opacity="0.7"/>
</svg>
